name: SpecD Isolated Runtime Trial V1

on:
  pull_request:
    paths:
      - 'experiments/specd_isolated_v1/**'
      - 'tests/test_specd_isolated_runtime_trial_v1.py'
      - 'docs/architecture/SPECD_ISOLATED_RUNTIME_TRIAL_V1_SPEC.md'
      - 'docs/audits/SPECD_ISOLATED_RUNTIME_TRIAL_V1_*.md'
      - 'docs/governance/UPSTREAM_ADOPTION_MATRIX_V3.md'
      - '.github/workflows/specd-isolated-runtime-trial.yml'

permissions:
  contents: read

jobs:
  specd-isolated-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SPECD_COMMIT: 14422dba5c1cc64f04205f3ebfa3d435cd790aa0
      KNOWN_BLOCKED_COMMIT: 14422dba5c1cc64f04205f3ebfa3d435cd790aa0
      SPECD_RECHECK_ENABLED: 'false'
      PNPM_VERSION: 10.6.5
      REPETITIONS: '5'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create evidence directory
        run: mkdir -p trial-evidence/raw

      - name: Verify frozen fixture hashes
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('experiments/specd_isolated_v1')
          manifest = json.loads((root / 'fixture_manifest.json').read_text())
          for item in manifest['files']:
              path = root / item['path']
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'hash mismatch: {item["path"]}: {actual}')
          print('fixture hashes verified')
          PY

      - name: Monitor known blocked SpecD pin without rerunning runtime
        id: monitor_gate
        if: env.SPECD_RECHECK_ENABLED != 'true'
        env:
          NEXUS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence = Path('trial-evidence')
          result = {
              'schema': 'nexus.specd-isolated-runtime-result.v1',
              'decision': 'MONITOR',
              'evidence_class': 'DOCUMENTED_UPSTREAM_CAPABILITY',
              'runtime_comparison': 'NOT_TESTED',
              'blocker': 'known_blocked_commit',
              'upstream_repository': 'specd-sdd/SpecD',
              'upstream_commit': os.environ['SPECD_COMMIT'],
              'known_blocked_commit': os.environ['KNOWN_BLOCKED_COMMIT'],
              'reason': 'No new reproducible SpecD commit/tag was identified; the previously blocked pin is not rerun.',
              'global_framework_comparison': 'BLOCKED',
              'comparable_subset_score_0_100': 'NOT_TESTED'
          }
          result_path = evidence / 'result.json'
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          receipt = {
              'schema': 'nexus.execution-receipt.specd-isolated-v1',
              'evidence_class': 'DOCUMENTED_UPSTREAM_CAPABILITY',
              'nexus_head_sha': os.environ['NEXUS_HEAD_SHA'],
              'upstream_commit': os.environ['SPECD_COMMIT'],
              'phase_reached': 'monitor_gate',
              'failure_phase': None,
              'runtime_queries_executed': 0,
              'decision': 'MONITOR',
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest()
          }
          (evidence / 'execution-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          cp experiments/specd_isolated_v1/protocol.json trial-evidence/protocol.json
          cp experiments/specd_isolated_v1/fixture_manifest.json trial-evidence/fixture-manifest.json

      - name: Clone and verify exact SpecD upstream commit
        id: clone
        if: env.SPECD_RECHECK_ENABLED == 'true'
        continue-on-error: true
        run: |
          git clone --filter=blob:none https://github.com/specd-sdd/SpecD.git "$RUNNER_TEMP/specd-upstream"
          git -C "$RUNNER_TEMP/specd-upstream" checkout --detach "$SPECD_COMMIT"
          test "$(git -C "$RUNNER_TEMP/specd-upstream" rev-parse HEAD)" = "$SPECD_COMMIT"
          git -C "$RUNNER_TEMP/specd-upstream" rev-parse HEAD | tee trial-evidence/upstream-head.txt

      - name: Set up pinned package manager
        id: package_manager
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.clone.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/specd-upstream
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          pnpm --version | tee "$GITHUB_WORKSPACE/trial-evidence/pnpm-version.txt"

      - name: Install frozen upstream dependencies
        id: dependency_install
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.package_manager.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/specd-upstream
        run: pnpm install --frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/trial-evidence/upstream-install.log"

      - name: Build source-pinned SpecD CLI
        id: upstream_build
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.dependency_install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/specd-upstream
        run: pnpm --filter @specd/cli... build 2>&1 | tee "$GITHUB_WORKSPACE/trial-evidence/upstream-build.log"

      - name: Smoke-test built CLI
        id: cli_smoke
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.upstream_build.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/specd-upstream
        run: node packages/cli/dist/index.js --help > "$GITHUB_WORKSPACE/trial-evidence/cli-help.txt"

      - name: Prepare isolated TypeScript fixture
        id: fixture
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.cli_smoke.outcome == 'success'
        continue-on-error: true
        run: |
          FIXTURE="$RUNNER_TEMP/specd-fixture"
          mkdir -p "$FIXTURE/src"
          cp experiments/specd_isolated_v1/fixture/src/*.ts "$FIXTURE/src/"
          git -C "$FIXTURE" init
          git -C "$FIXTURE" config user.name 'NEXUS Trial'
          git -C "$FIXTURE" config user.email 'nexus-trial@example.invalid'
          git -C "$FIXTURE" add src
          git -C "$FIXTURE" commit -m 'fixture: frozen graph case'

      - name: Run real SpecD graph index
        id: graph_index
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.fixture.outcome == 'success'
        continue-on-error: true
        run: |
          CLI="$RUNNER_TEMP/specd-upstream/packages/cli/dist/index.js"
          FIXTURE="$RUNNER_TEMP/specd-fixture"
          node "$CLI" graph index --path "$FIXTURE" --force --format json 2>trial-evidence/raw/index.stderr | tee trial-evidence/raw/index.json

      - name: Run five real SpecD impact queries
        id: graph_impact
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.graph_index.outcome == 'success'
        continue-on-error: true
        run: |
          CLI="$RUNNER_TEMP/specd-upstream/packages/cli/dist/index.js"
          FIXTURE="$RUNNER_TEMP/specd-fixture"
          : > trial-evidence/durations.txt
          for i in 1 2 3 4 5; do
            start=$(date +%s%N)
            node "$CLI" graph impact --path "$FIXTURE" --direction dependents --depth 3 --format json --file src/core.ts > "trial-evidence/raw/impact-$i.json" 2> "trial-evidence/raw/impact-$i.stderr"
            end=$(date +%s%N)
            python -c "print(round(($end - $start) / 1000000, 3))" >> trial-evidence/durations.txt
          done
          python - <<'PY'
          import json
          from pathlib import Path
          values = [float(x) for x in Path('trial-evidence/durations.txt').read_text().splitlines() if x.strip()]
          Path('trial-evidence/raw/durations-ms.json').write_text(json.dumps(values, indent=2) + '\n')
          PY

      - name: Evaluate bounded comparable subset
        id: evaluator
        if: env.SPECD_RECHECK_ENABLED == 'true' && steps.graph_impact.outcome == 'success'
        continue-on-error: true
        env:
          NEXUS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python experiments/specd_isolated_v1/trial.py \
            --raw-dir trial-evidence/raw \
            --oracle experiments/specd_isolated_v1/fixture/oracle.json \
            --output trial-evidence/result.json \
            --receipt trial-evidence/execution-receipt.json \
            --upstream-commit "$SPECD_COMMIT" \
            --nexus-head "$NEXUS_HEAD_SHA" \
            --repetitions "$REPETITIONS"
          cp experiments/specd_isolated_v1/protocol.json trial-evidence/protocol.json
          cp experiments/specd_isolated_v1/fixture_manifest.json trial-evidence/fixture-manifest.json

      - name: Record phase-specific runtime blockage
        if: env.SPECD_RECHECK_ENABLED == 'true' && always() && steps.evaluator.outcome != 'success'
        env:
          NEXUS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          PM_OUTCOME: ${{ steps.package_manager.outcome }}
          INSTALL_OUTCOME: ${{ steps.dependency_install.outcome }}
          BUILD_OUTCOME: ${{ steps.upstream_build.outcome }}
          CLI_OUTCOME: ${{ steps.cli_smoke.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          INDEX_OUTCOME: ${{ steps.graph_index.outcome }}
          IMPACT_OUTCOME: ${{ steps.graph_impact.outcome }}
          EVALUATOR_OUTCOME: ${{ steps.evaluator.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence = Path('trial-evidence')
          phases = [
              ('clone', os.getenv('CLONE_OUTCOME'), 'UPSTREAM_SOURCE_CHECKOUT_FAILED'),
              ('package_manager_setup', os.getenv('PM_OUTCOME'), 'UPSTREAM_PACKAGE_MANAGER_SETUP_FAILED'),
              ('dependency_install', os.getenv('INSTALL_OUTCOME'), 'UPSTREAM_DEPENDENCY_INSTALL_FAILED'),
              ('build', os.getenv('BUILD_OUTCOME'), 'UPSTREAM_BUILD_FAILED'),
              ('cli_smoke', os.getenv('CLI_OUTCOME'), 'UPSTREAM_CLI_SMOKE_FAILED'),
              ('fixture', os.getenv('FIXTURE_OUTCOME'), 'FIXTURE_PREPARATION_FAILED'),
              ('graph_index', os.getenv('INDEX_OUTCOME'), 'UPSTREAM_GRAPH_INDEX_FAILED'),
              ('graph_impact', os.getenv('IMPACT_OUTCOME'), 'UPSTREAM_GRAPH_IMPACT_FAILED'),
              ('evaluation', os.getenv('EVALUATOR_OUTCOME'), 'NEXUS_EVALUATOR_FAILED'),
          ]
          failure_phase, blocker = 'unknown', 'UNKNOWN_RUNTIME_BLOCKER'
          for phase, outcome, code in phases:
              if outcome == 'failure':
                  failure_phase, blocker = phase, code
                  break
          install_log = evidence / 'upstream-install.log'
          if failure_phase == 'dependency_install' and install_log.exists() and 'ERR_PNPM_OUTDATED_LOCKFILE' in install_log.read_text(errors='replace'):
              blocker = 'UPSTREAM_FROZEN_LOCKFILE_MISMATCH'
          result = {
              'schema': 'nexus.specd-isolated-runtime-result.v1',
              'decision': 'BLOCKED',
              'evidence_class': 'REAL_RUNTIME_EVIDENCE',
              'runtime_comparison': 'NOT_TESTED',
              'failure_phase': failure_phase,
              'blocker': blocker,
              'upstream_commit': os.environ['SPECD_COMMIT'],
              'global_framework_comparison': 'BLOCKED',
              'comparable_subset_score_0_100': 'NOT_TESTED'
          }
          result_path = evidence / 'result.json'
          result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          receipt = {
              'schema': 'nexus.execution-receipt.specd-isolated-v1',
              'evidence_class': 'REAL_RUNTIME_EVIDENCE',
              'nexus_head_sha': os.environ['NEXUS_HEAD_SHA'],
              'upstream_commit': os.environ['SPECD_COMMIT'],
              'phase_reached': failure_phase,
              'failure_phase': failure_phase,
              'runtime_queries_executed': 0 if failure_phase != 'graph_impact' else 'PARTIAL_UNKNOWN',
              'decision': 'BLOCKED',
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest()
          }
          (evidence / 'execution-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          cp experiments/specd_isolated_v1/protocol.json trial-evidence/protocol.json
          cp experiments/specd_isolated_v1/fixture_manifest.json trial-evidence/fixture-manifest.json

      - name: Upload trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specd-isolated-runtime-trial-v1
          path: trial-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Assert bounded outcome was recorded
        if: always()
        run: |
          test -f trial-evidence/result.json
          test -f trial-evidence/execution-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('trial-evidence/result.json').read_text())
          assert result.get('runtime_comparison') == 'NOT_TESTED' or result.get('evidence_class') == 'REAL_RUNTIME_EVIDENCE'
          assert result.get('global_framework_comparison') == 'BLOCKED'
          print('SpecD evidence boundary recorded:', result.get('decision'), result.get('blocker'))
          PY
